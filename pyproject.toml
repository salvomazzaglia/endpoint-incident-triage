[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endpoint-incident-triage"
version = "1.0.0"
description = "Cross-platform, non-destructive endpoint incident-triage toolkit with evidence integrity verification."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Salvatore Mazzaglia", email = "90605302+salvomazzaglia@users.noreply.github.com" },
]
keywords = [
  "dfir",
  "incident-response",
  "endpoint-triage",
  "forensics",
  "evidence-integrity",
  "sha256",
  "windows",
  "linux",
  "security",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
]

[project.scripts]
endpoint-incident-triage = "endpoint_incident_triage.cli:main"

[project.urls]
Homepage = "https://github.com/salvomazzaglia/endpoint-incident-triage"
Documentation = "https://github.com/salvomazzaglia/endpoint-incident-triage#readme"
Repository = "https://github.com/salvomazzaglia/endpoint-incident-triage"
Issues = "https://github.com/salvomazzaglia/endpoint-incident-triage/issues"
Changelog = "https://github.com/salvomazzaglia/endpoint-incident-triage/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
endpoint_incident_triage = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/python"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
source = ["endpoint_incident_triage"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "RUF",
]
ignore = [
  "E501",
  "UP042",
  "SIM102",
  "SIM108",
  "RUF043",
  "RUF059",
]


[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "F401", "I001", "RUF059"]
"scripts/**" = ["T201", "F401"]
"src/endpoint_incident_triage/aggregation.py" = ["I001"]
"src/endpoint_incident_triage/collector_runner.py" = ["I001"]
"src/endpoint_incident_triage/case.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["endpoint_incident_triage"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
pretty = true
